#:schema node_modules/wrangler/config-schema.json
# Cloudflare Worker — scheduled Nafas archive.
# Deploy separately from the Pages project:
#   cd workers/nafas-archive
#   wrangler deploy
#
# After deploy, bind a manual-trigger secret:
#   wrangler secret put CRON_SECRET
# Then you can kick off a backfill from your laptop with:
#   curl -H "X-Secret: $SECRET" https://nafas-archive.<subdomain>.workers.dev/run

name = "nafas-archive"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron: every 15 minutes. Matches Nafas's own ~15 min refresh.
# (If you'd rather poll less, switch to "*/30 * * * *" or "0 * * * *".)
[triggers]
crons = ["*/15 * * * *"]

# D1 binding — same database as the Pages function.
# Replace `database_id` with the real ID after `wrangler d1 create bali-air-archive`.
[[d1_databases]]
binding = "ARCHIVE_DB"
database_name = "bali-air-archive"
database_id = "REPLACE_WITH_REAL_D1_ID"

# Keep the worker anonymous — no observability that logs request bodies,
# no tail subscribers. If you enable observability later, disable sampling
# and keep logs out of any third-party sink.
[observability]
enabled = false
