# Cloudflare Worker — IQAir station scraper (hourly).
#
# Scrapes each configured IQAir station page via Firecrawl, decodes the page's
# own React-Router stream payload (no IQAir API), and archives current PM2.5 +
# hourly/daily/monthly history into D1 (iq_scrape_* tables).
#
# Secret (set once, never committed):
#   npx wrangler secret put FIRECRAWL_KEY
#
# IQAir publishes hourly. We fire every 15 min but rotate through 4 station
# groups (≤3 stations per tick), so each station is still scraped ~once/hour
# while each invocation stays small. This is the safeguard against the failure
# that froze every station: firing all 10 at once against Firecrawl's
# maxConcurrency=2 meant a slow render window pushed the cron past its execution
# budget and it was killed mid-flight. The page's 48h hourly window backstops
# any missed run, and re-scrapes are idempotent (UPSERT).

name = "iqair-scrape"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Same D1 database the rest of the site uses (separate iq_scrape_* tables).
[[d1_databases]]
binding = "ARCHIVE_DB"
database_name = "bali-air-archive"
database_id = "0a3c2a5d-6c11-40d6-ac01-7ca2a5a6c600"

# Service binding -> nafas-archive, for the reciprocal watchdog. Mirrors the
# nafas-archive -> iqair-scrape binding that already exists in the other
# direction, so each worker can revive the other when its cron dies. Routes
# through the runtime, never public DNS: a same-account Worker-to-Worker
# subrequest over a workers.dev hostname is intercepted by the edge and 404s
# (documented at length in nafas-archive's wrangler.toml).
[[services]]
binding = "NAFAS_ARCHIVE"
service = "nafas-archive"

[triggers]
crons = ["7,22,37,52 * * * *"]   # every 15 min at :07/:22/:37/:52 (offset from the *:00/15/30/45 nafas cron); one rotating station group per tick
